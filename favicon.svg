<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Ambient Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#glowGrad)" />

  <!-- Outer Aerodynamic Air Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#bladeGrad1)" stroke-width="2.5" stroke-dasharray="16 8 32 8" opacity="0.85" />
  <circle cx="50" cy="50" r="39" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

  <!-- 4 Dynamic Aerodynamic Turbo Blades -->
  <g transform="rotate(0 50 50)">
    <!-- Blade 1 (Top) -->
    <path d="M 50 50 C 50 32, 42 16, 54 8 C 62 14, 60 30, 50 50 Z" fill="url(#bladeGrad1)" filter="url(#neonGlow)" />
    <!-- Blade 2 (Right) -->
    <path d="M 50 50 C 68 50, 84 42, 92 54 C 86 62, 70 60, 50 50 Z" fill="url(#bladeGrad2)" filter="url(#neonGlow)" />
    <!-- Blade 3 (Bottom) -->
    <path d="M 50 50 C 50 68, 58 84, 46 92 C 38 86, 40 70, 50 50 Z" fill="url(#bladeGrad1)" filter="url(#neonGlow)" />
    <!-- Blade 4 (Left) -->
    <path d="M 50 50 C 32 50, 16 58, 8 46 C 14 38, 30 40, 50 50 Z" fill="url(#bladeGrad2)" filter="url(#neonGlow)" />
  </g>

  <!-- Speed Vortex Accents -->
  <path d="M 44 20 A 32 32 0 0 1 78 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <path d="M 56 80 A 32 32 0 0 1 22 62" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Central High-Precision Turbine Hub -->
  <circle cx="50" cy="50" r="14" fill="#0f172a" stroke="url(#bladeGrad1)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="9" fill="url(#coreGrad)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>
